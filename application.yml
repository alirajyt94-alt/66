server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "YOUR_SUPER_SECURE_PASSWORD" # Change this!
    sources:
      youtube: false # Disabled because we use the plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5